      step_description: "Select \"Free 5 PM to 8 PM\" and tap Done"
    - type: "validation"
      step_description: "The pill at the top right reads \"Free 5 to 8\""
    - type: "instructions"
      step_description: "Tap the \"Free 5 to 8\" pill, select \"Free now till 8 PM\" and tap Done"
    - type: "validation"
      step_description: "The pill reads \"Free till 8\""
