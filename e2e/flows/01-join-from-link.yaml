test:
  metadata:
    name: "frolic-join-from-link"
    platform: "ios"
    tags:
      - "frolic"
      - "onboarding"
      - "feature-2"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/join"
    - type: "validation"
      step_description: "The headline \"Be the friend who says yes.\" is visible with the line \"Frolic plans your hangouts. No asking, no deciding, no flaking.\" under it"
    - type: "validation"
      step_description: "A \"Start a crew\" button and an \"I have an invite link\" button are visible"
    - type: "validation"
      step_description: "No contacts permission prompt, phone number field or sign-in code field is shown"
    - type: "instructions"
      step_description: "Tap \"I have an invite link\""
    - type: "validation"
      step_description: "The sheet asks \"Paste your invite link\" with a field labelled \"Invite link\" and a \"Find my crew\" button"
    - type: "instructions"
      step_description: "Type \"sunset-crew\" in the field labelled \"Invite link\" and tap \"Find my crew\""
    - type: "validation"
      step_description: "The invite sheet is closed and the headline \"Be the friend who says yes.\" is visible again"
