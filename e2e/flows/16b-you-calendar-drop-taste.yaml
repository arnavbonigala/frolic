test:
  metadata:
    name: "frolic-you-calendar-drop-taste"
    platform: "ios"
    tags:
      - "frolic"
      - "you"
      - "feature-3"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/you"
    - type: "instructions"
      step_description: "Scroll to \"Free time\""
    - type: "validation"
      step_description: "A \"Read my calendar\" switch and a \"Daily plan arrives\" menu are visible"
    - type: "instructions"
      step_description: "Open \"Daily plan arrives\" and choose \"4 PM\""
    - type: "validation"
      step_description: "The value reads \"4 PM\""
    - type: "instructions"
      step_description: "Turn off the \"Read my calendar\" switch"
    - type: "validation"
      step_description: "The line \"You'll pick when you're free from the pill on Today.\" is visible"
    - type: "validation"
      step_description: "A section \"What you're into\" shows taste chips and a \"Pick photos again\" button"
