test:
  metadata:
    name: "frolic-tp-dev"
    platform: "ios"
    tags:
      - "frolic"
      - "three-phone"
      - "multi-device"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "{{dev_link}}"
    - type: "manual"
      step_type: "set_location"
      step_description: "37.8651,-122.2578"
    - type: "validation"
      step_description: "The Today screen is visible with a plan card and the buttons \"I'm down\" and \"Only with…\""
    - type: "validation"
      step_description: "The line \"Maya, Dev, Jordan and Priya are free\" or the seeded free line is visible"
    - type: "code_execution"
      script: "barrier-t0"
      timeout_seconds: 240
    - type: "validation"
      step_description: "Nothing on screen shows that Maya or anyone else is down"
    - type: "code_execution"
      script: "barrier-t30"
      timeout_seconds: 240
    - type: "instructions"
      step_description: "Tap \"I'm down\""
    - type: "validation"
      step_description: "The line \"Your bud is planted. Waiting for a friend\" is visible"
    - type: "validation"
      step_description: "Nothing on screen shows that Maya is down, and no \"It's on.\" is visible yet"
    - type: "while"
      condition: "The headline \"It's on.\" is not visible"
      body:
        - type: "manual"
          step_type: "wait"
          step_description: "1"
    - type: "extraction"
      step_description: "Read the clock in the status bar"
      variable_name: "dev_flip_clock"
    - type: "code_execution"
      script: "stamp-server-time"
      variable_name: "dev_flip_stamp"
      timeout_seconds: 60
    - type: "validation"
      step_description: "The headline \"It's on.\" is visible above the line \"You, Maya\""
    - type: "validation"
      step_description: "Flowers for You and Maya are visible together"
    - type: "manual"
      step_type: "wait"
      step_description: "15"
    - type: "validation"
      step_description: "\"It's on.\" is shown once and no second reveal or duplicate celebration occurred"
    - type: "instructions"
      step_description: "Tap \"I'm on my way\""
    - type: "validation"
      step_description: "The heading \"Sunset at Indian Rock\" is visible"
