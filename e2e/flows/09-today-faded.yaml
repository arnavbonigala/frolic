test:
  metadata:
    name: "frolic-today-faded"
    platform: "ios"
    tags:
      - "frolic"
      - "today"
      - "feature-5"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:faded?fixture=1&tomorrow=1"
    - type: "validation"
      step_description: "The headline \"This one drifted off\" is visible"
    - type: "validation"
      step_description: "The text \"Nobody knows you said yes.\" is visible"
    - type: "validation"
      step_description: "The words \"declined\" and \"rejected\" appear nowhere on the screen"
    - type: "validation"
      step_description: "A row starting \"Tomorrow: \" reads \"Maya and Dev are going to Kayaks at the Marina. There's room for you.\""
