test:
  metadata:
    name: "frolic-you-private-limits"
    platform: "ios"
    tags:
      - "frolic"
      - "you"
      - "feature-private-limits"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/you"
    - type: "validation"
      step_description: "The section header \"Only you see these\" is visible with the lock icon"
    - type: "validation"
      step_description: "A \"Spend up to\" control shows Free, $10, $25 and Any, an \"Energy\" control shows Chill and Down for anything, and \"Travel up to\" shows a slider"
    - type: "instructions"
      step_description: "Tap \"$10\" under \"Spend up to\" and tap \"Chill\" under \"Energy\""
    - type: "validation"
      step_description: "\"$10\" and \"Chill\" are shown as selected"
    - type: "instructions"
      step_description: "Drag the \"Travel up to\" slider to its lowest position"
    - type: "validation"
      step_description: "The label reads \"5 min by foot or BART\""
    - type: "instructions"
      step_description: "Open the \"Home by\" menu and choose \"10 PM\""
    - type: "validation"
      step_description: "The \"Home by\" value reads \"10 PM\""
    - type: "validation"
      step_description: "The line \"Plans quietly fit everyone's limits. Nobody has to say \"I can't afford that.\"\" is visible"
    - type: "instructions"
      step_description: "Switch to the Crew tab and back to the You tab"
    - type: "validation"
      step_description: "\"$10\", \"Chill\", \"5 min by foot or BART\" and \"10 PM\" are still selected"
    - type: "validation"
      step_description: "Nothing on the Crew tab shows any of these values for the user"
