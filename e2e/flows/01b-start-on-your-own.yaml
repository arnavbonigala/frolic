test:
  metadata:
    name: "frolic-start-on-your-own"
    platform: "ios"
    tags:
      - "frolic"
      - "onboarding"
      - "feature-1"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/join"
    - type: "instructions"
      step_description: "Tap \"Start a crew\""
    - type: "validation"
      step_description: "The screen asks \"What do your friends call you?\""
    - type: "instructions"
      step_description: "Type \"Ari\" in the first name field and tap Continue"
    - type: "validation"
      step_description: "The screen reads \"Your crew is ready\" with \"Anyone with this code can join.\""
    - type: "instructions"
      step_description: "Tap \"Go to Today\""
    - type: "validation"
      step_description: "The Today screen shows the headline plan card with \"I'm down\""
