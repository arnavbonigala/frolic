test:
  metadata:
    name: "frolic-tp-maya"
    platform: "ios"
    tags:
      - "frolic"
      - "three-phone"
      - "multi-device"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "{{maya_link}}"
    - type: "manual"
      step_type: "set_location"
      step_description: "37.8719,-122.2585"
    - type: "validation"
      step_description: "The Today screen is visible with a plan card and the buttons \"I'm down\" and \"Only if…\""
    - type: "validation"
      step_description: "The line \"Maya, Dev, Jordan and Priya are free\" or the seeded free line is visible"
    - type: "code_execution"
      script: "barrier-t0"
      timeout_seconds: 240
    - type: "instructions"
      step_description: "Tap \"Only if…\", tap Dev, then tap \"I'm down if Dev\""
    - type: "validation"
      step_description: "The status card reads \"You're down, if Dev\""
    - type: "validation"
      step_description: "Nothing on screen shows that anyone else is down, no count, no avatar of Dev as down, and no \"It's on.\""
    - type: "code_execution"
      script: "barrier-t30"
      timeout_seconds: 240
    - type: "while"
      condition: "The headline \"It's on.\" is not visible"
      body:
        - type: "manual"
          step_type: "wait"
          step_description: "1"
    - type: "extraction"
      step_description: "Read the clock in the status bar"
      variable_name: "maya_flip_clock"
    - type: "code_execution"
      script: "stamp-server-time"
      variable_name: "maya_flip_stamp"
      timeout_seconds: 60
    - type: "validation"
      step_description: "The headline \"It's on.\" is visible above the line \"You, Dev\" or \"You, Dev and Jordan\""
    - type: "validation"
      step_description: "Flowers for You and Dev are visible together"
    - type: "manual"
      step_type: "wait"
      step_description: "15"
    - type: "validation"
      step_description: "\"It's on.\" is shown once and no second reveal or duplicate celebration occurred"
    - type: "instructions"
      step_description: "Tap \"I'm on my way\""
    - type: "validation"
      step_description: "The heading \"Sunset at Indian Rock\" is visible"
