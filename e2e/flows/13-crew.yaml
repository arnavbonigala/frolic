test:
  metadata:
    name: "frolic-crew"
    platform: "ios"
    tags:
      - "frolic"
      - "crew"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/crew"
    - type: "validation"
      step_description: "The heading \"Sunset Crew\" is visible with \"5 of you · the crew started in September\""
    - type: "validation"
      step_description: "Under \"Today\" rows for You, Maya, Dev, Jordan and Priya show free windows and rough distances such as \"Free till 8 · 6 min away\""
    - type: "validation"
      step_description: "The line \"Distances are rough on purpose. Nobody sees exactly where you are.\" is visible and no map or pin is shown"
    - type: "instructions"
      step_description: "Tap Jordan"
    - type: "validation"
      step_description: "A sheet shows \"Free till 6\", \"15 min away, roughly\" and \"You'll never see whether Jordan said yes or no to a plan. That's the point.\""
    - type: "instructions"
      step_description: "Close the sheet and tap \"Invite a friend\""
    - type: "validation"
      step_description: "A sheet titled \"Invite to Sunset Crew\" shows \"frolic.app/j/sunset-crew\" with buttons \"Copy link\" and \"Text it\""
    - type: "instructions"
      step_description: "Tap \"Copy link\""
    - type: "validation"
      step_description: "A toast reads \"Link copied\""
    - type: "instructions"
      step_description: "Scroll down to the section \"Lately\""
    - type: "validation"
      step_description: "Rows read \"Bloomed at Cheese Board\", \"Bloomed at bowling\" and \"Bloomed at the Glade picnic\""
    - type: "validation"
      step_description: "The section \"Your crew's favorites\" lists \"Sunset at Indian Rock\" with \"5 times\""
