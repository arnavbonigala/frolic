test:
  metadata:
    name: "frolic-crew"
    platform: "ios"
    tags:
      - "frolic"
      - "crew"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/crew"
    - type: "validation"
      step_description: "The hero reads \"5 of 5 free today\" above the crew switcher \"Sunset Crew\" with \"5 of you · the crew started in September\""
    - type: "validation"
      step_description: "Under \"Today\" rows for You, Maya, Dev, Jordan and Priya show free windows and rough distances such as \"Free till 8 · 6 min away\""
    - type: "instructions"
      step_description: "Tap Jordan"
    - type: "validation"
      step_description: "A sheet shows \"Free till 6\", \"15 min away, roughly\" and \"No frolics together yet\""
    - type: "instructions"
      step_description: "Close the sheet and tap \"Invite a friend\""
    - type: "validation"
      step_description: "A sheet titled \"Invite to Sunset Crew\" shows the invite code with a \"Copy link\" button"
    - type: "instructions"
      step_description: "Tap \"Copy link\""
    - type: "validation"
      step_description: "A toast reads \"Link copied\""
    - type: "instructions"
      step_description: "Close the sheet and scroll down to the section \"Coming up\""
    - type: "validation"
      step_description: "The \"Coming up\" row reads \"Sunday 11 AM:\" then \"Kayaks at the Marina. Maya and Dev are going.\""
    - type: "validation"
      step_description: "The \"Hold $3\" row reads \"Show up and it's released. Flake and it funds the next one.\""
    - type: "validation"
      step_description: "The \"Frolic Fund\" section reads \"Frolic Fund $6\" with \"toward the next one\", \"A no-show added $3.\" and \"The Frolic Fund covered $3.\""
