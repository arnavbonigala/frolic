test:
  metadata:
    name: "frolic-checkin-group-snap"
    platform: "ios"
    tags:
      - "frolic"
      - "check-in"
      - "feature-8"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/checkin"
    - type: "validation"
      step_description: "A camera view shows a card \"You're all here\" with \"Group snap fires every phone at the same second. You'll see their shots once you add yours.\""
    - type: "validation"
      step_description: "A \"Skip photo\" button and a button \"Group snap with Maya and Dev\" are visible"
    - type: "instructions"
      step_description: "Tap \"Group snap with Maya and Dev\""
    - type: "validation"
      step_description: "A countdown from 3 shows with \"Maya's and Dev's phones are counting too\""
    - type: "manual"
      step_type: "wait"
      step_description: "5"
    - type: "validation"
      step_description: "A polaroid press shows \"Indian Rock · Nov 15 · 4:30\" with \"Taken at the same second on 3 phones. Nobody saw the others until they added theirs.\""
    - type: "instructions"
      step_description: "Tap \"Plant it in the garden\""
    - type: "validation"
      step_description: "The Garden screen is visible with a toast \"Planted in your crew's garden\" and a new flower for you"
