test:
  metadata:
    name: "frolic-checkin-group-snap"
    platform: "ios"
    tags:
      - "frolic"
      - "checkin"
      - "feature-6"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/checkin"
    - type: "validation"
      step_description: "A camera view shows a card \"You're all here\" with \"Everyone's shot unlocks when you add yours.\""
    - type: "validation"
      step_description: "A \"Skip photo\" button and a button \"Group snap with Maya and Dev\" are visible"
    - type: "instructions"
      step_description: "Tap \"Group snap with Maya and Dev\""
    - type: "validation"
      step_description: "A large numeral counts down over the viewfinder at the identifier checkin.count"
    - type: "manual"
      step_type: "wait"
      step_description: "5"
    - type: "validation"
      step_description: "A polaroid press shows the place, the day and the start time with \"Taken at the same second on 3 phones.\""
    - type: "instructions"
      step_description: "Tap \"Plant it in the garden\""
    - type: "validation"
      step_description: "The planted memory opens from the Garden with a \"Back to Garden\" button"
