test:
  metadata:
    name: "frolic-hop-in-sunday-paid"
    platform: "ios"
    tags:
      - "frolic"
      - "today"
      - "feature-5"
      - "money"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:open?fixture=1&paid=1"
    - type: "validation"
      step_description: "The plan card is titled \"Kayaks at the Marina\" with chips \"$8 each\", \"2 hours\" and \"Calm before noon\""
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:hopin?fixture=1&paid=1"
    - type: "validation"
      step_description: "The card reads \"Ari, it's happening\" with \"Maya and Dev are going\""
    - type: "validation"
      step_description: "A row reads \"Kayaks at the Marina: The boat ramp at 4:30, $8 each.\" with the button \"Hop in for $8\" under it"
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:on?fixture=1&paid=1&pay=share&sheet=hold"
    - type: "validation"
      step_description: "A sheet titled \"Chip in for kayaks\" shows \"Your share\" $5.00 and \"Already paid\" Maya and Dev"
    - type: "validation"
      step_description: "The sheet reads \"If it gets called off, you get it back automatically.\" with a \"Pay $5.00\" button"
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:done?fixture=1&paid=1&pay=paid"
    - type: "validation"
      step_description: "A card reads \"You're in. Paid $8.\""
