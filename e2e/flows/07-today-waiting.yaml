test:
  metadata:
    name: "frolic-today-waiting"
    platform: "ios"
    tags:
      - "frolic"
      - "today"
      - "feature-5"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:open"
    - type: "instructions"
      step_description: "Tap \"I'm down\""
    - type: "validation"
      step_description: "The line \"Your bud is planted. Waiting for a friend\" is visible and a closed bud labelled \"You\" sits in the flower row"
    - type: "validation"
      step_description: "A status card reads \"You're down\" with \"If a friend says yes too, you'll both bloom at once. If not, it disappears at 4 and nobody ever knows.\""
    - type: "validation"
      step_description: "A \"Take it back\" button is visible and no countdown, \"seen by\" or count of friends is shown"
    - type: "instructions"
      step_description: "Tap \"Take it back\""
    - type: "validation"
      step_description: "The \"I'm down\" and \"Only with…\" buttons are visible again"
