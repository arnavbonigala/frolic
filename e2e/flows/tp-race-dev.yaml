test:
  metadata:
    name: "frolic-tp-race-dev"
    platform: "ios"
    tags:
      - "frolic"
      - "three-phone"
      - "race"
      - "multi-device"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "{{dev_link}}"
    - type: "manual"
      step_type: "set_location"
      step_description: "37.8651,-122.2578"
    - type: "validation"
      step_description: "The Today screen is visible with a plan card and the buttons \"I'm down\" and \"Only if…\""
    - type: "validation"
      step_description: "The line \"Maya, Dev, Jordan and Priya are free\" or the seeded free line is visible"
    - type: "code_execution"
      script: "barrier-t0"
      timeout_seconds: 240
    - type: "instructions"
      step_description: "Tap \"I'm down\""
    - type: "while"
      condition: "The headline \"It's on.\" is not visible"
      body:
        - type: "manual"
          step_type: "wait"
          step_description: "1"
    - type: "extraction"
      step_description: "Read the clock in the status bar"
      variable_name: "dev_flip_clock"
    - type: "manual"
      step_type: "wait"
      step_description: "20"
    - type: "validation"
      step_description: "\"It's on.\" is shown exactly once, with no second reveal, no duplicate celebration and no second notification"
