test:
  metadata:
    name: "frolic-waiting-only-if"
    platform: "ios"
    tags:
      - "frolic"
      - "today"
      - "feature-5"
  build:
    name: "frolic-ios"
  device:
    model: "iPhone 17 Pro Max"
    orientation: "portrait"
  blocks:
    - type: "manual"
      step_type: "navigate"
      step_description: "frolic://e2e/today:open?fixture=1"
    - type: "instructions"
      step_description: "Tap \"Only with…\", tap Maya, then tap \"I'm down if Maya\""
    - type: "validation"
      step_description: "The status card reads \"You're down, if Maya\""
    - type: "validation"
      step_description: "The line \"Waiting for Maya\" sits under the flower row"
    - type: "instructions"
      step_description: "Tap \"Take it back\", tap \"Only with…\", select Maya, Dev and Jordan and tap \"I'm down if Maya, Dev and Jordan\""
    - type: "validation"
      step_description: "The card title reads \"You're down, if all 3\" with \"Disappears at 4 if nobody joins.\""
