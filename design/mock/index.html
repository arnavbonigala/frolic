<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Frolic</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--ink:#23180F;--t2:#6B5F55;--t3:#8F8379;--cream:#FFF8EC;--paper:#fff;--line:rgba(35,24,15,.09);--chip:#F4EEE4;--sun:#FF6A2A;--green:#3DAA5C;--spring:cubic-bezier(.3,1.5,.5,1);--r:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9E4DC;display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

.ph{width:390px;height:844px;border-radius:55px;overflow:hidden;position:relative;background:var(--cream);color:var(--ink);box-shadow:0 30px 60px rgba(40,30,20,.25);isolation:isolate}
@media (max-width:500px){body{display:block}.ph{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
button,select{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2C4FD6;outline-offset:2px}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font:600 17px system-ui;z-index:30;pointer-events:none}
.status.onphoto{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.status i{display:flex}.status i b{display:block;width:25px;height:12px;border-radius:4px;border:1.5px solid currentColor;position:relative}
.status i b::after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.scr{position:relative;min-height:100%;animation:in .35s ease both}
.sky{background:linear-gradient(180deg,#CFE5FF 0,#E9F1FB 170px,var(--cream) 380px)}

.fl{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.fl:nth-child(2){animation-delay:-1.2s}.fl:nth-child(3){animation-delay:-2.1s}.fl:nth-child(4){animation-delay:-.6s}.fl:nth-child(5){animation-delay:-3s}

.fl span{font:600 12px system-ui;color:var(--t2);margin-top:2px}
.fl.bud span{color:var(--ink)}

.tabs button[aria-current=page]{color:var(--ink);background:rgba(35,24,15,.06)}
.tabs svg{width:26px;height:22px}
.page{padding:104px 18px 120px}
.lt{font:800 34px/40px var(--r);margin:0}

.field{width:100%;height:56px;border-radius:16px;border:0;background:#fff;box-shadow:0 0 0 1px rgba(35,24,15,.1);color:var(--ink);font:400 20px system-ui;padding:0 18px;margin-top:22px}

.avatar-add{display:block;margin:26px auto 0;text-align:center;font:600 15px system-ui;color:var(--t2)}

.bottom-cta{position:absolute;left:18px;right:18px;bottom:30px}

.mem-list{display:grid;gap:10px}

 <div class="pk"><h1 style="${(o.title||PL().title).length>20?'font-size:25px;line-height:29px':''}">${o.title||PL().title}</h1><div class="chips" style="margin-top:10px">${(o.chips||PL().chips).map(c=>`<span class="chip">${c}</span>`).join('')}</div>${o.why===false?'':`<p style="margin:10px 2px 0;font:400 13px/18px system-ui;color:var(--t2)"><b style="color:var(--ink);font-weight:600">Why this:</b> ${o.why||PL().why}</p>`}</div></div>`;

 if(S.free==='no')return `<div class="scr sky" style="height:100%">${topbar()}

 <div style="padding:30px 22px 0;text-align:center"><h1>Taking the day off</h1><p class="sub" style="font-size:17px;line-height:23px;margin-top:10px">No plan for you today, and nobody gets told. If your crew's plan happens, you can still hop in.</p></div>
 <div class="acts" style="margin-top:22px"><button class="btn sec" style="flex:1" onclick="S.free='till8';rerender();toast('Back in. Free till 8')">I'm free after all</button></div></div>`;
 if(S.phase==='on'){const m=S.match;return `<div class="scr sky" style="height:100%">${topbar()}
 <div class="bunch">${['you',...m].map((k,i)=>`<div class="fl">${bloomSvg(k,50,[70,120,90,104][i])}<span>${k==='you'?(S.name||'You'):P[k].n}</span></div>`).join('')}</div>
 <div style="padding:16px 22px 0"><p class="sub" style="font-weight:700;color:var(--ink)">You, ${names(m.map(k=>P[k].n))}</p><h1 class="huge">It's on.</h1>
 <p class="sub" style="font-size:17px;line-height:23px;margin-top:10px">${PL().meet} at <b style="color:var(--ink)">${PL().time}</b>. Leave by <b style="color:var(--ink)">${PL().leave}</b> and ${PL().tip}.</p></div>
 <div class="acts" style="margin-top:20px"><button class="btn pri" onclick="go('otw')">I'm on my way</button><button class="btn sec" onclick="toast('Opening Apple Maps')">Directions</button></div>
 <p class="hush">${names(FR.filter(k=>!m.includes(k)).map(k=>P[k].n))} can still hop in.</p></div>`}
 if(S.phase==='done')return `<div class="scr sky" style="min-height:100%;padding-bottom:110px">${topbar()}
 <div class="bunch" style="height:210px">${['you',...(S.match.length?S.match:['maya','dev'])].map((k,i)=>`<div class="fl">${bloomSvg(k,36,[50,80,64][i])}<span>${k==='you'?(S.name||'You'):P[k].n}</span></div>`).join('')}</div>
 <div style="padding:14px 22px 0;text-align:center"><h1>You went.</h1><p class="sub" style="font-size:17px;line-height:23px;margin-top:8px">Your first flower is in the garden, and the crew saw it bloom.</p></div>
 <div class="acts" style="margin-top:18px"><button class="btn sec" style="flex:1" onclick="go('garden')">See the garden</button></div>
 <button class="row-link" onclick="peekSheet()"><img src="img/${NEXT().img}.jpg" alt=""><span><b>Tomorrow at 3:</b> ${NEXT().title} is looking likely.</span>${I.chev}</button>${sundayRow()}</div>`;
 if(S.phase==='faded')return `<div class="scr sky" style="height:100%">${topbar()}
 <div class="meadow" style="margin-top:20px">${FR.map(k=>`<div class="fl fold">${bloomSvg(k,30,46)}<span>${P[k].n}</span></div>`).join('')}</div>
 <div style="padding:34px 22px 0;text-align:center"><h1>This one drifted off</h1><p class="sub" style="font-size:17px;line-height:23px;margin-top:10px">Nobody knows you said yes.</p></div>
 <button class="row-link" style="margin-top:24px" onclick="peekSheet()"><img src="img/${NEXT().img}.jpg" alt=""><span><b>Tomorrow at 3:</b> a new plan for whoever's free. ${NEXT().title} is looking likely.</span>${I.chev}</button>${sundayRow()}</div>`;
 const waiting=S.phase==='waiting';const oi=S.onlyIf.map(k=>P[k].n);
 return `<div class="scr sky" style="min-height:100%;padding-bottom:110px">${topbar()}
 <button class="meadow" style="height:128px" onclick="go('crew')" aria-label="Maya, Dev, Jordan and Priya are free. See your crew">${FR.map((k,i)=>`<div class="fl">${bloomSvg(k,28,[36,14,44,24][i])}<span>${P[k].n}</span></div>`).join('')}${waiting?`<div class="fl bud new">${budSvg('you',24,22)}<span>You</span></div>`:''}</button>
 <span class="cap">${waiting?'Your bud is planted. Waiting for a friend<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>':'Maya, Dev, Jordan and Priya are free'}</span>
 ${packet(waiting?{why:false}:{})}
 ${waiting?`<div class="card" style="margin:14px 16px 0;display:flex;gap:12px;align-items:center" role="status"><span style="color:var(--t2)">${I.lock}</span><div class="nm"><b style="font-size:16px">You're down${oi.length?`, if ${ifIn(oi)}`:''}</b><small style="display:block">${oi.length>2?`If ${names(oi)} all say yes, you'll bloom together. The more people you need, the rarer it blooms.`:oi.length===2?`If ${names(oi)} both say yes, you'll bloom together.`:oi.length?`If ${oi[0]} says yes too, you'll both bloom at once.`:"If a friend says yes too, you'll both bloom at once."} If not, it disappears at 4 and nobody ever knows.</small></div></div>
 <div class="acts"><button class="btn sec" style="flex:1" onclick="S.phase='open';S.onlyIf=[];clearTimeout(S.revealTimer);rerender()">Take it back</button></div>`
 :`<div class="acts"><button class="btn pri" onclick="down([])">I'm down</button><button class="btn sec" onclick="onlyIfSheet()">Only with…</button></div>
 <p class="hush">${I.lock} Nobody sees you're down unless they are too</p>${sundayRow()}`}</div>`};
function down(list){S.onlyIf=list;S.match=list.length?list.slice():['maya','dev'];S.phase='waiting';closeSheet();rerender();clearTimeout(S.revealTimer);
 S.revealTimer=setTimeout(()=>{if(S.phase!=='waiting')return;if(S.onlyIf.length>=4||(S.onlyIf.length===3&&Math.random()<.5)){S.phase='faded';rerender();return}S.phase='on';if(location.hash.slice(1).startsWith('today')||!location.hash){rerender();petals();navigator.vibrate&&navigator.vibrate(30)}else toast("It's on! Check Today")},6000)}
function soloDown(){S.onlyIf=[];S.match=['maya'];S.phase='waiting';rerender();if(S.sent)soloReveal()}
function soloReveal(){clearTimeout(S.revealTimer);S.revealTimer=setTimeout(()=>{if(S.phase!=='waiting')return;S.solo=false;S.phase='on';S.match=['maya'];rerender();petals();toast('Maya said yes from the link')},6000)}
function shareSheet(){sheet('Send to the group chat',`<div style="background:#fff;border-radius:22px;padding:14px;margin-top:10px;box-shadow:0 0 0 .5px rgba(35,24,15,.08)">
 <p style="margin:0 0 8px;font:600 13px system-ui;color:var(--t2)">Roommates</p>
 <div style="margin-left:auto;max-width:250px;background:#2C7BF6;color:#fff;border-radius:18px 18px 4px 18px;overflow:hidden">
 <img src="img/${PL().img}.jpg" alt="" style="width:100%;height:110px;object-fit:cover;display:block"><div style="padding:8px 12px 10px;background:#E9E9EB;color:#111"><b style="font:600 14px system-ui;display:block">${PL().title}</b><small style="font:400 12px system-ui;color:#555">frolic.app · say you're down, secretly</small></div>
 <p style="margin:0;padding:8px 12px 10px;font:400 15px/20px system-ui">Anyone free for this? Say you're down on the link. It stays secret unless someone else is too.</p></div></div>
 <p class="foot">Friends can say yes from the link without the app. Anyone who taps joins your crew.</p>
 <button class="btn pri wide" style="margin-top:14px" onclick="closeSheet();S.sent=true;rerender();toast('Sent to Roommates');if(S.phase==='waiting')soloReveal()">Send</button>
 <button class="txtbtn" onclick="closeSheet();go('web')">See what friends see</button>`)}
function peekSheet(){const n=NEXT();sheet("Tomorrow's plan",`<p class="sub">It arrives at 3 PM, picked for whoever's free. Here's the likely one.</p><div style="margin:4px -16px 0">${packet({label:'TOMORROW · SUNDAY',no:'Likely',img:n.img,alt:n.title,pos:n.pos,title:n.title,chips:n.chips,why:n.why,band:'background:#4A6FF5;color:#fff'})}</div><button class="btn sec wide" style="margin-top:14px" onclick="closeSheet()">Sounds good</button>`)}
function onlyIfSheet(){S.pick=new Set();const body=()=>{const sel=[...S.pick].map(k=>P[k].n);return `<p class="sub">Pick who has to be there. It only happens if they all say yes. Nobody ever finds out you picked them.</p>
 <div class="pickgrid">${FR.map(k=>`<button class="pick" aria-pressed="${S.pick.has(k)}" onclick="S.pick.has('${k}')?S.pick.delete('${k}'):S.pick.add('${k}');window._d()">${bloomSvg(k,26,0)}${P[k].n}</button>`).join('')}</div>
 <button class="btn pri wide" style="margin-top:14px" ${sel.length?'':'disabled'} onclick="down([...S.pick])">${sel.length?`I'm down if ${ifIn(sel)}`:'Pick at least one friend'}</button>`};
 window._d=()=>sheet("I'm down only with…",body());window._d()}
function freeSheet(){window._d=()=>sheet('When are you free today?',`<p class="sub">Your crew sees this. What you're doing stays private.</p>
 <div class="group" style="margin-top:14px" role="radiogroup" aria-label="When are you free">${Object.entries(FREE).map(([k,v])=>`<button class="radio" role="radio" aria-checked="${S.free===k}" onclick="S.free='${k}';window._d()"><span>${v[1]}${k==='till8'&&S.cal?'<small>From your calendar</small>':''}${k==='after5'?'<small>Set by you, just for today</small>':''}${k==='no'?'<small>No plan for you today. Nobody gets told.</small>':''}</span><i class="r"></i></button>`).join('')}</div>
 <button class="btn pri wide" style="margin-top:14px" onclick="closeSheet();if(S.free==='no'){S.phase='open';clearTimeout(S.revealTimer)}rerender()">Done</button>`,'fh');window._d()}
R.otw=()=>{clearInterval(S.etaTimer);let you=PL().walk;S.etaTimer=setInterval(()=>{if(!$('#eta-you')){clearInterval(S.etaTimer);return}you=Math.max(1,you-1);$('#eta-you').textContent=you+' min away';$('#bar-you').style.width=(100-you*6)+'%';$('#cd').innerHTML=you+' min<small>away</small>'},2500);
 const m=S.match.length?S.match:['maya','dev'];const m2=m[1]||m[0];
 const row=(k,t,w,id)=>`<div class="cell" style="align-items:flex-start;padding:12px 16px">${bloomSvg(k,22,0)}<div class="nm"><b>${k==='you'?(S.name||'You'):P[k].n}</b><small ${id?'id="eta-you"':''}>${t}</small><div class="route"><i ${id?'id="bar-you"':''} style="width:${w}%;background:${C[P[k].c][1]}"></i></div></div></div>`;
 return `<div class="scr" style="padding-bottom:60px"><div class="band-img" style="background-image:url(img/${PL().band}.jpg);background-position:50% 55%"></div>
 <div class="top" style="position:absolute;left:0;right:0;top:0"><button class="circ" onclick="go('today')" aria-label="Back to Today">${I.back}</button></div>
 <div style="padding:0 18px;margin-top:-50px;position:relative;z-index:2"><p class="sub" style="font-weight:700;color:var(--ink)">It's on · ${PL().time}</p><h1 class="huge" style="font-size:36px;line-height:40px">${PL().title}</h1>
 <p class="sec-h">Who's where</p><div class="group">${row(m[0],'Here',100)}${m[1]?row(m[1],'4 min away',72):''}${row('you',PL().walk+' min away',28,1)}</div>

 <p class="sec-h">On your lock screen</p>
 <div class="la">${bloomSvg(m[0],18,0)}<div class="t"><b>${PL().place.replace(/^the /,'The ')} at ${PL().time}</b><small>${P[m[0]].n}'s there.${m[1]?` ${P[m2].n} is 4 min out.`:''}</small></div><span class="cd" id="cd">${PL().walk} min<small>away</small></span></div>
 <button class="btn pri wide" style="margin-top:20px" onclick="go('checkin')">I'm here</button>
 <button class="txtbtn" onclick="bailSheet()">I can't make it</button></div></div>`};
function bailSheet(){sheet("Can't make it?",`<p class="sub">Your crew will see a spot open up.</p><div class="acts" style="margin:16px 0 0"><button class="btn sec" style="flex:1" onclick="closeSheet()">I'll still go</button><button class="btn pri" onclick="closeSheet();S.phase='open';go('today');toast('All good. Next time.')">Sit this one out</button></div>`)}
function snapPics(){const sh=PL().shots;return [[sh[0],'35% 50%'],[sh[1],'70% 45%'],[PL().img,'50% 30%']]}
function tilt(e,el){const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;const i=el.querySelector('.press-in');i.classList.remove('idle');i.style.transform=`rotateX(${-y*22}deg) rotateY(${x*28}deg)`}
function untilt(el){const i=el.querySelector('.press-in');i.style.transform='';i.classList.add('idle')}
addEventListener('deviceorientation',e=>{const i=document.querySelector('.press-in');if(!i||e.beta==null)return;i.classList.remove('idle');i.style.transform=`rotateX(${Math.max(-20,Math.min(20,(e.beta-45)*.5))}deg) rotateY(${Math.max(-25,Math.min(25,e.gamma*.6))}deg)`});
function startSnap(){S.snap='count';rerender();let n=3;const el=()=>$('#cd3');const t=setInterval(()=>{n--;if(!el()){clearInterval(t);return}if(n>0){el().textContent=n;el().style.animation='none';el().offsetHeight;el().style.animation=''}else{clearInterval(t);$('#fl').classList.add('go');navigator.vibrate&&navigator.vibrate(20);setTimeout(()=>{S.snap='done';rerender();setTimeout(()=>{document.querySelectorAll('.pc.wait').forEach((e,k)=>setTimeout(()=>e.classList.remove('wait'),k*500))},500)},450)}},900)}
R.checkin=()=>{const m=S.match.length?S.match:['maya','dev'];const who=['you',...m].slice(0,3);const pics=snapPics();
 if(S.snap==='done')return `<div class="scr" style="min-height:100%;padding-bottom:30px"><div style="padding:66px 18px 0;text-align:center"><p class="sub" style="font-weight:700;color:var(--ink);margin:0">Group snap</p><h1 style="margin-top:4px">Every angle, one moment</h1></div>
 <div class="press" onpointermove="tilt(event,this)" onpointerleave="untilt(this)"><div class="press-in idle">${pics.slice(0,who.length).map(([im,pos],k)=>`<div class="pc${k?' wait':''}" style="--r:${[-4,5,-2][k]}deg"><img src="img/${im}.jpg" alt="${k?(P[who[k]].n+'\'s shot'):'Your shot'}" style="object-position:${pos}"><span>${bloomSvg(who[k],11,0)}${k?P[who[k]].n:(S.name||'You')}</span></div>`).join('')}</div>

 <div style="padding:16px 18px 0"><button class="btn pri wide" onclick="S.shotPhoto=pics[0][0];S.snap=null;S.newMem=true;S.went=true;S.phase='done';go('garden');setTimeout(()=>toast('Planted in your crew\'s garden'),300)">Plant it in the garden</button>
 <button class="btn sec wide" style="margin-top:10px" onclick="S.snap=null;rerender()">Take it again together</button></div></div>`;
 const counting=S.snap==='count';
 return `<div class="scr cam" style="height:100%"><img class="v" style="object-position:35% 50%" src="img/${pics[0][0]}.jpg" alt="Camera view"><div class="flash" id="fl"></div>
 <div class="top"><button class="circ" onclick="S.snap=null;go('otw')" aria-label="Back">${I.back}</button><button class="pill" style="background:rgba(20,14,10,.6);color:#fff;box-shadow:none" onclick="S.went=true;S.phase='done';go('garden')">Skip photo</button></div>
 ${counting?`<div class="count"><b id="cd3">3</b><p>${m.length>1?names(m.map(k=>P[k].n+'\'s')):P[m[0]].n+'\'s'} ${m.length>1?'phones are':'phone is'} counting too</p></div>`
 :`<div class="snapcard"><div style="display:flex;gap:2px">${who.map(k=>bloomSvg(k,16,0)).join('')}</div><div><b>You're all here</b><small>Group snap fires every phone at the same second. You'll see their shots once you add yours.</small></div></div>`}
 <div class="cam-bot">${counting?'<div style="height:78px"></div>':`<button class="btn pri wide" style="background:#fff;color:#1C1310" onclick="startSnap()">Group snap with ${names(m.map(k=>P[k].n))}</button>`}</div></div>`};
R.sunday=()=>`<div class="scr sky" style="min-height:100%;padding-bottom:40px"><div class="top"><button class="circ" onclick="go('today')" aria-label="Back to Today">${I.back}</button><span class="pill"><span class="dot"></span>You're free all day</span></div>
 <div class="meadow" style="height:130px">${['maya','dev'].map((k,i)=>`<div class="fl">${bloomSvg(k,30,[30,48][i])}<span>${P[k].n}</span></div>`).join('')}${S.sundayIn?`<div class="fl new">${bloomSvg('you',30,38)}<span>${S.name||'You'}</span></div>`:''}</div>

 :`<p class="sub" style="font-size:16px;color:var(--ink);margin:0 4px 14px">Maya and Dev are already going. It's happening either way, so there's no risk in joining.</p><button class="btn pri wide" onclick="chipSheet()">Hop in for $8</button><p class="foot" style="text-align:center">Everyone pays their own share up front</p>`}</div></div>`;

 <p class="sec-h">Today</p><div class="group">
 <div class="cell">${bloomSvg('you',22,0)}<div class="nm"><b>${S.name||'You'}</b><small><span class="dot${S.free==='no'?' off':''}"></span>${S.went?'Went today':FREE[S.free][0]}</small></div></div>
 ${FR.map(k=>`<button class="cell" onclick="friendSheet('${k}')">${bloomSvg(k,22,0)}<div class="nm"><b>${P[k].n}</b><small><span class="dot"></span>${S.went&&S.match.includes(k)?'Went with you today':(S.went?{jordan:'Busy now',priya:'Free till 10 · 11 min away',maya:'Free till 8 · 6 min away',dev:'Free till 9 · 9 min away'}[k]:`${STAT[k][0]} · ${STAT[k][1]}`)}</small></div>${I.chev}</button>`).join('')}</div>
 <p class="foot">Distances are rough on purpose. Nobody sees exactly where you are.</p>
 <p class="sec-h">Coming up</p><button class="row-link" style="margin:0;width:100%" onclick="go('sunday')"><img src="img/marina_sunset.jpg" alt=""><span><b>Sunday 11 AM:</b> Kayaks at the Marina. ${S.sundayIn?"You, Maya and Dev.":"Maya and Dev are going."}</span>${I.chev}</button>
 
 <button class="btn sec wide" style="margin-top:14px" onclick="inviteSheet()">${I.share.replace('<svg','<svg width="16" height="20"')}Invite a friend</button>
 <p class="sec-h">Lately</p><div class="group">${lately()}</div>
 ${S.went?`<p class="sec-h">New this week</p><div class="group"><div class="cell np"><img src="img/${PL().img}.jpg" alt="" style="width:40px;height:40px;border-radius:10px;object-fit:cover"><div class="nm"><b style="font-size:16px">${PL().title}</b><small>Your first frolic with the crew</small></div></div></div>`:''}
 <p class="sec-h">Your crew's favorites</p><div class="group">${[['Sunset at Indian Rock',5],['Cheese Board pizza',4],['Bowling at the Union',2],['Picnic on Memorial Glade',1],['The Berkeley Pier at dusk',1]].map(([a,b])=>[a,b+(S.went&&PL().title===a?1:0)]).sort((x,y)=>(y[1]+(S.went&&y[0]===PL().title?.5:0))-(x[1]+(S.went&&x[0]===PL().title?.5:0))).slice(0,3).map(([a,b])=>[a+(S.went&&a===PL().title?' (you went)':''),b+(b===1?' time':' times')]).map(([a,b])=>`<div class="cell np"><div class="nm"><b>${a}</b></div><span class="val">${b}</span></div>`).join('')}</div></div>`;
function friendSheet(k){sheet(P[k].n,`<div style="display:flex;justify-content:center;margin:6px 0 10px">${bloomSvg(k,46,0)}</div><div class="group"><div class="cell np"><div class="nm"><b>${STAT[k][0]}</b><small>${STAT[k][1]}, roughly</small></div></div><div class="cell np"><div class="nm"><b>${S.went&&S.match.includes(k)?'1 frolic together':'No frolics together yet'}</b><small>${S.went&&S.match.includes(k)?'Indian Rock, today':`${P[k].n} has ${STAT[k][2]} with the crew`}</small></div></div></div><p class="foot">You'll never see whether ${P[k].n} said yes or no to a plan. That's the point.</p>`)}
function inviteSheet(){sheet('Invite to Sunset Crew',`<p class="sub">Only people you send this to can join. Your crew sees when someone new joins, and the link expires in 7 days.</p><div class="card" style="margin-top:14px;font:600 16px system-ui;text-align:center">frolic.app/j/sunset-crew</div><div class="acts" style="margin:14px 0 0"><button class="btn sec" style="flex:1" onclick="closeSheet();toast('Link copied')">Copy link</button><button class="btn pri" onclick="closeSheet();toast('Opening Messages')">Text it</button></div>`)}
const MEM=[['hills_sunset','Sunset at Indian Rock','Today',['maya','dev'],['marina_people','hills_sunset','rock'],'pink'],['cheeseboard','Cheese Board pizza','Nov 8',['maya','dev','jordan'],['cheeseboard','friends','berkeley'],'marigold'],['bowling','Bowling','Nov 2',['dev','jordan','priya','maya'],['bowling','friends','cheeseboard'],'cobalt'],['picnic','Picnic on the Glade','Oct 26',['priya','maya'],['picnic','berkeley','friends'],'moss'],['marina_sunset','The Marina','Oct 19',['maya','dev','priya'],['marina_sunset','marina_people','rock'],'lilac'],['friends','Beach day','Oct 12',['jordan','priya','dev','maya'],['friends','marina_people','picnic'],'tomato']];
R.garden=()=>{const list=S.went?MEM:MEM.slice(1);const count=list.length+7;const cols=['pink','marigold','cobalt','moss','lilac','tomato','pink','moss','marigold','cobalt','lilac','tomato','pink'];
 const h=`<div class="scr page" style="padding-top:96px"><h2 class="lt">Garden</h2><p class="sub">Every frolic grows a flower. It never wilts.${S.went?'':' Sunset Crew grew these before you joined.'}</p>
 <div class="garden" style="margin-top:16px"><div class="garden-cap">${count} frolics<small>${S.went?'12 before you, 1 with you':'all before you joined'}</small></div>${cols.slice(0,12).map((c,i)=>`<div class="g" style="left:${12+i*24}px;animation-delay:${-i*.4}s">${bloomSvg(null,13,[30,52,40,64,36,58,44,70,32,50,42,60,46][i%13],c)}</div>`).join('')}${S.went?`<div class="g${S.newMem?' fl new':''}" style="left:262px;bottom:10px;animation-delay:-1s">${bloomSvg('you',20,74)}</div>`:''}</div>
 <button class="row-link" style="margin:12px 0 0;width:100%" onclick="storySheet()"><span style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#FFBE2E;flex:none">${bloomSvg(null,16,0,'tomato')}</span><span><b>Your crew this week:</b> ${crewLine()}</span>${I.chev}</button>
 <p class="sec-h">Frolics</p><div class="mem-list">${list.map(m=>`<button class="mem${S.newMem&&m===MEM[0]?' new':''}" onclick="go('memory/${MEM.indexOf(m)}')"><img src="img/${m[0]}.jpg" alt=""><div class="nm"><b>${m[1]}</b><small>${m[2]} · ${m===MEM[0]?'you and ':''}${names(m[3].map(k=>P[k].n))}</small></div>${I.chev}</button>`).join('')}</div></div>`;S.newMem=false;return h};
function storySheet(){sheet('Share your crew',`<div class="story"><div style="position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center">${MARK().replace('class="mark"','class="mark" style="width:70px"')}</div><div style="position:absolute;top:66px;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:0">${['you',...FR].map((k,i)=>bloomSvg(k,24,[56,84,46,76,62][i])).join('')}</div><div style="position:absolute;left:16px;right:16px;bottom:22px"><p style="margin:0;font:700 12px system-ui;color:var(--t2)">SUNSET CREW · 13 FROLICS</p><p style="margin:4px 0 0;font:800 22px/25px var(--r)">${crewLine().charAt(0).toUpperCase()+crewLine().slice(1)}</p></div></div>
 <button class="btn pri wide" style="margin-top:16px" onclick="closeSheet();toast('Saved. Ready for Stories')">Share to Stories</button>`)}
R.memory=i=>{const m=MEM[+i]||MEM[1];return `<div class="scr" style="padding-bottom:40px"><img class="hero-img" src="img/${m[0]}.jpg" alt="${m[1]}">
 <div class="top" style="position:absolute;left:0;right:0;top:0"><button class="circ" onclick="go('garden')" aria-label="Back to Garden">${I.back}</button><button class="circ" onclick="toast('Saved. Ready for Stories')" aria-label="Share">${I.share}</button></div>
 <div style="padding:18px 18px 0"><p class="sub" style="font-weight:700;color:var(--ink)">${m[2]}</p><h1 style="font-size:34px;line-height:38px">${m[1]}</h1>
 <div class="meadow" style="height:96px;justify-content:flex-start;gap:4px;padding:0">${(m===MEM[0]?['you',...m[3]]:m[3]).map((k,j)=>`<div class="fl">${bloomSvg(k,20,[24,34,20,30,26][j])}<span>${k==='you'?(S.name||'You'):P[k].n}</span></div>`).join('')}</div>
 <p class="sec-h">Photos</p></div><div class="strip">${m[4].map(x=>`<img src="img/${x}.jpg" alt="">`).join('')}</div></div>`};
R.you=()=>`<div class="scr page sky" style="padding-top:96px"><div style="display:flex;align-items:center;gap:12px">${bloomSvg('you',36,0)}<div><h2 class="lt" style="font-size:28px;line-height:34px">${S.name||'You'}</h2><p class="sub" style="margin:0">Sunset Crew</p></div></div>
 <div class="card" style="margin-top:18px;display:flex;gap:12px;align-items:center">${S.went?`<span style="display:inline-flex">${['you',...(S.match.length?S.match:['maya','dev'])].slice(0,3).map(k=>bloomSvg(k,19,0)).join('')}</span><div class="nm"><b style="font-size:16px">Your first frolic</b><small style="display:block">You, ${names((S.match.length?S.match:['maya','dev']).map(k=>P[k].n))} bloomed at ${PL().place} today.</small></div>`:`${budSvg('you',16,0).replace(/height="\d+"/,'height="40"')}<div class="nm"><b style="font-size:16px">No frolics yet</b><small style="display:block">Your first flower grows the first time you go.</small></div>`}</div>
 <p class="sec-h">${I.lock} Only you see these</p><div class="group">
 <div class="setting"><div class="lbl">Spend up to</div><div class="seg" role="group" aria-label="Spend up to">${['Free','$10','$25','Any'].map((v,i)=>`<button aria-pressed="${S.budget===i}" onclick="S.budget=${i};rerender()">${v}</button>`).join('')}</div></div>
 <div class="setting"><div class="lbl">Energy</div><div class="seg" role="group" aria-label="Energy">${['Chill','Down for anything'].map((v,i)=>`<button aria-pressed="${S.energy===i}" onclick="S.energy=${i};rerender()">${v}</button>`).join('')}</div></div>
 <div class="setting"><label class="lbl" for="far">Travel up to <span id="farv">${S.far} min by foot or BART</span></label><input id="far" type="range" min="5" max="45" step="5" value="${S.far}" oninput="S.far=+this.value;$('#farv').textContent=this.value+' min by foot or BART'"></div>
 <div class="setting srow"><label for="home">Home by</label><select id="home" onchange="S.home=this.value">${['9 PM','10 PM','11 PM','Midnight','Whenever'].map(v=>`<option ${v===S.home?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <p class="foot">Plans quietly fit everyone's limits. Nobody has to say "I can't afford that."</p>
 <p class="sec-h">Free time</p><div class="group"><div class="setting srow"><span>Read my calendar</span><button class="tog" role="switch" aria-checked="${S.cal}" aria-label="Read my calendar" onclick="S.cal=!S.cal;rerender()"></button></div>
 <div class="setting srow"><label for="drop">Daily plan arrives</label><select id="drop" onchange="S.drop=this.value">${['Noon','2 PM','3 PM','4 PM'].map(v=>`<option ${v===S.drop?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <p class="foot">${S.cal?'Frolic only shares "free" or "busy," never what\'s on your calendar.':'You\'ll pick when you\'re free from the pill on Today.'}</p>
 <p class="sec-h">What you're into</p><div class="chips">${tasteTags().map(t=>`<span class="chip big">${t}</span>`).join('')}</div>
 <button class="txtbtn" style="margin-left:0;padding:0 4px" onclick="go('taste')">Pick photos again</button></div>`;
function addMin(t,m){let [h,mi]=t.split(':').map(Number);let x=h*60+mi+m;h=Math.floor(x/60);mi=x%60;h=((h-1)%12)+1;return h+':'+String(mi).padStart(2,'0')}
function syncMem(){const m=S.match.length?S.match:['maya','dev'];const ph=(S.shotPhoto||'marina_people');MEM[0][0]=ph;MEM[0][3]=m;MEM[0][4]=[ph,...PL().shots.filter(x=>x!==ph),PL().img].slice(0,3);MEM[0][1]=PL().title}
R.web=()=>{const st=S.webState||'open';return `<div class="scr" style="min-height:100%;background:var(--cream)"><div style="padding:54px 12px 8px;background:#F2F2F4;border-bottom:.5px solid #ddd"><div style="height:36px;border-radius:12px;background:#E3E3E8;display:flex;align-items:center;justify-content:center;font:500 15px system-ui;color:#333">${I.lock.replace('fill="currentColor"','fill="#888"')}&nbsp; frolic.app/p/${PL().place.toLowerCase().replace(/^the /,'').replace(/ /g,'-')}</div></div>
 <div style="padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center">${MARK().replace('class="mark"','class="mark" style="width:76px"')}<button class="txtbtn" style="margin:0;height:auto;padding:0;font-size:15px" onclick="go('today')">Back to the app</button></div>
 <p class="sub" style="padding:10px 18px 0;margin:0;font-weight:600;color:var(--ink)">${S.name||'Ari'} shared a plan with Roommates</p>
 <div style="margin:0 0 0">${packet({label:'TODAY · SATURDAY',no:'Frolic',why:undefined})}</div>
 <div style="padding:16px 18px 30px">${st==='on'?`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${bloomSvg('maya',26,0)}${bloomSvg('you',26,0)}</div><h1 style="margin-top:6px">It's on.</h1><p class="sub">You and ${S.name||'Ari'}, ${PL().meet} at ${PL().time}.</p></div><button class="btn pri wide" style="margin-top:14px" onclick="toast('Opening the App Store')">Get Frolic for the next one</button>`
 :st==='down'?`<div class="card" style="display:flex;gap:12px;align-items:center" role="status"><span style="color:var(--t2)">${I.lock}</span><div class="nm"><b style="font-size:16px">You're down, Maya</b><small style="display:block">Only you know. Keep this page open: it blooms the moment someone else says yes.</small></div></div>`
 :`<label class="sr" for="wn">Your first name</label><input id="wn" class="field" style="margin-top:0" placeholder="Your first name" value="Maya"><button class="btn pri wide" style="margin-top:12px" onclick="S.webState='down';rerender();setTimeout(()=>{if(location.hash==='#web'){S.webState='on';rerender();petals()}},4000)">I'm down</button><p class="hush">${I.lock} Nobody sees you're down unless someone else is too. No app needed.</p>`}</div></div>`};
const TABBED={today:'today',crew:'crew',garden:'garden',you:'you'};
function rerender(){
 let [r,arg]=(location.hash.slice(1)||'join').split('/');
 if(r.includes(':')){const [a,b]=r.split(':');r=a;S.phase=b;if((b==='on'||b==='done')&&!S.match.length)S.match=['maya','dev'];if(b==='done')S.went=true}
 if(r==='memories')r='garden';
 if(!R[r])r='join';
 closeSheet();syncMem();
 view.innerHTML=R[r](arg);
 renderTabs(TABBED[r]);
 const t=PL().time,L=PL().leave;const CL={open:'3:06',waiting:'3:07',on:'3:09',faded:'4:00',done:addMin(t,2)};$('#clock').textContent=r==='otw'?addMin(L,2):r==='checkin'?addMin(t,-1):S.went?addMin(t,2):CL[S.phase]||'3:06';
 $('#status').className='status'+((r==='checkin'&&S.snap!=='done')||r==='memory'?' onphoto':'');if(r!=='web')S.webState=S.webState==='on'?'on':S.webState;
 if(r==='today'&&S.askFree){S.askFree=false;setTimeout(freeSheet,400)}
}
addEventListener('hashchange',()=>{view.scrollTop=0;rerender()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if(location.search.includes('demo')){S.name='Ari';S.photo=true}
if(location.search.includes('solo'))S.solo=true;
if(location.search.includes('shot'))document.body.classList.add('shot');
rerender();
</script>
</body></html>
